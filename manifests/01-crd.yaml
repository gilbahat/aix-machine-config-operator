apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aixconfigpools.amco.reuna-labs.io
spec:
  group: amco.reuna-labs.io
  scope: Cluster
  names:
    kind: AIXConfigPool
    listKind: AIXConfigPoolList
    plural: aixconfigpools
    singular: aixconfigpool
    shortNames: [acp]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Config
      type: string
      jsonPath: .status.renderedConfig
    - name: Updated
      type: string
      jsonPath: .status.conditions[?(@.type=="Updated")].status
    - name: Updating
      type: string
      jsonPath: .status.conditions[?(@.type=="Updating")].status
    - name: Degraded
      type: string
      jsonPath: .status.conditions[?(@.type=="Degraded")].status
    - name: MachineCount
      type: integer
      jsonPath: .status.machineCount
    - name: ReadyMachineCount
      type: integer
      jsonPath: .status.readyMachineCount
    - name: UpdatedMachineCount
      type: integer
      jsonPath: .status.updatedMachineCount
    - name: DegradedMachineCount
      type: integer
      jsonPath: .status.degradedMachineCount
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        description: AIXConfigPool groups AIX nodes that share one rendered configuration and rollout policy.
        properties:
          apiVersion: {type: string}
          kind: {type: string}
          metadata: {type: object}
          spec:
            type: object
            properties:
              nodeSelector:
                description: Selects the pool's nodes (only nodes with kubernetes.io/os=aix are managed). Defaults to node-role.kubernetes.io/aix.
                type: object
                x-kubernetes-map-type: atomic
                properties:
                  matchLabels:
                    type: object
                    additionalProperties: {type: string}
                  matchExpressions:
                    type: array
                    items:
                      type: object
                      required: [key, operator]
                      properties:
                        key: {type: string}
                        operator: {type: string}
                        values:
                          type: array
                          items: {type: string}
              maxUnavailable:
                description: Nodes (or percentage) that may be unavailable at once during a rollout. Defaults to 1.
                anyOf:
                - type: integer
                - type: string
                x-kubernetes-int-or-string: true
              paused:
                description: Stops new nodes from starting an update.
                type: boolean
          status:
            type: object
            properties:
              observedGeneration: {type: integer, format: int64}
              renderedConfig: {type: string}
              machineCount: {type: integer, format: int32}
              updatedMachineCount: {type: integer, format: int32}
              readyMachineCount: {type: integer, format: int32}
              unavailableMachineCount: {type: integer, format: int32}
              degradedMachineCount: {type: integer, format: int32}
              warnings:
                type: array
                items: {type: string}
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type: {type: string}
                    status: {type: string, enum: ["True", "False", "Unknown"]}
                    observedGeneration: {type: integer, format: int64}
                    lastTransitionTime: {type: string, format: date-time}
                    reason: {type: string}
                    message: {type: string}
