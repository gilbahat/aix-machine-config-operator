# The default pool: every AIX node (node-role.kubernetes.io/aix, which the
# operator adds to nodes reporting kubernetes.io/os=aix). KubeletConfigs and
# ContainerRuntimeConfigs target it with
#   machineConfigPoolSelector:
#     matchLabels:
#       pools.amco.reuna-labs.io/aix: ""
# and it merges the AIXMachineConfigs labelled amco.reuna-labs.io/role: aix.
apiVersion: amco.reuna-labs.io/v1alpha1
kind: AIXConfigPool
metadata:
  name: aix
  labels:
    pools.amco.reuna-labs.io/aix: ""
spec:
  maxUnavailable: 1
  configSelector:
    matchLabels:
      amco.reuna-labs.io/role: aix
