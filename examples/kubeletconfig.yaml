apiVersion: machineconfiguration.openshift.io/v1
kind: KubeletConfig
metadata:
  name: aix-max-pods
spec:
  machineConfigPoolSelector:
    matchLabels:
      pools.amco.reuna-labs.io/aix: ""
  kubeletConfig:
    maxPods: 110
    imageGCHighThresholdPercent: 80
---
apiVersion: machineconfiguration.openshift.io/v1
kind: ContainerRuntimeConfig
metadata:
  name: aix-containerd-debug
spec:
  machineConfigPoolSelector:
    matchLabels:
      pools.amco.reuna-labs.io/aix: ""
  containerRuntimeConfig:
    logLevel: debug
    logSizeMax: 20Mi
